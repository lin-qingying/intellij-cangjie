name: Bug 报告
description: 提交一个 Bug 报告以帮助我们改进
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！我们将尽快处理。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要描述你遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 重现步骤
      description: 请详细描述如何重现这个问题。例如：
        1. 第一步操作
        2. 第二步操作
        3. 其他操作...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 请描述你期望发生的事情。
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 请描述实际发生的事情。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供以下信息：
        - 操作系统（例如：Windows 10, macOS Big Sur, Ubuntu 20.04）
        - 浏览器（例如：Chrome 90, Firefox 88）
        - 版本（例如：v1.2.3）
        - 其他相关信息（例如：依赖库版本、硬件信息等）
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息
      description: 请提供任何其他可能有助于解决问题的信息，例如错误日志、截图等。
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: 其他
      options:
        - label: 我已经搜索过现有的 Issue，但没有找到类似的问题。
          required: false