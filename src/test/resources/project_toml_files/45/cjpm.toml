[target.aarch64-linux-ohos]
compile-option = "-B\"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B\"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L\"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L\"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\""

[dependencies]
charset4cj = {branch = "v0.0.1.B001", git = "https://gitcode.com/Cangjie-TPC/charset4cj.git", version = "0.0.1"}
image = {branch = "qrcode_lib", git = "https://gitee.com/HW-PLLab/image.git", version = "0.0.1"}

[package]
cjc-version = "0.54.3"
compile-option = "-O2 --int-overflow=wrapping --warn-off all"
description = "CangjieUI Application"
link-option = ""
name = "QRCode4cj"
output-type = "dynamic"
src-dir = "src"
target-dir = ""
version = "0.0.1"
package-configuration = {}
scripts = {}

[profile]
build = {incremental = false, lto = ""}
customized-option = {debug = "-g", release = "--fast-math -O2"}
test = {}

[target.aarch64-linux-ohos.bin-dependencies]
path-option = ["${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/ohos", "${DEVECO_CANGJIE_HOME}/build/x86_64-w64-mingw32/macro/ohos"]
package-option = {}