syntax = "proto3";

import "model.proto";

package proto;

// ============================================================================
// Target and Process Management
// ============================================================================

message CreateTargetRequest {
  string executable_path = 1;
  string architecture = 2;
  string remote_executable_path = 3;
  string platform = 4;
  string platform_sdk_root = 5;
}

message LaunchRequest {
  ProcessLaunchInfo launch_info = 1;
  ConsoleMode console_mode = 2;
}

message RemoteLaunchRequest {
  ProcessLaunchInfo launch_info = 1;
  string fd_passing_socket = 2;
}

message AttachByNameRequest {
  string process_name = 1;
  bool wait_for_launch = 2;
  bool continue_after_attach = 3;
}

message AttachRequest {
  int32 process_id = 1;
  string fd_passing_socket = 2;
  bool continue_after_attach = 3;
}

message LoadCoreRequest {
  string core_dump_path = 1;
}

message DetachRequest {}

message KillRequest {}

message ExitRequest {}

// ============================================================================
// Execution Control
// ============================================================================

message ContinueRequest {}

message SuspendRequest {}

message StepIntoRequest {
  uint32 thread_id = 1;
  bool step_by_instruction = 2;
}

message StepOverRequest {
  uint32 thread_id = 1;
  bool step_by_instruction = 2;
}

message StepOutRequest {
  uint32 thread_id = 1;
}

message StepScriptedRequest {
  uint32 thread_id = 1;
  string step_class_name = 2;
}

message JumpToLineRequest {
  uint32 thread_id = 1;
  string file_path = 2;
  uint32 line = 3;
  bool allow_leaving_function = 4;
}

message JumpToAddressRequest {
  uint32 thread_id = 1;
  uint64 address = 2;
  bool allow_leaving_function = 3;
}

// ============================================================================
// Thread and Frame Inspection
// ============================================================================

message GetThreadsRequest {}

message GetFramesRequest {
  uint32 thread_id = 1;
  uint32 start_index = 2;
  uint32 count = 3;
  bool until_valid_source_line = 4;
}

// ============================================================================
// Breakpoints and Watchpoints
// ============================================================================

message AddBreakpointRequest {
  string file_path = 1;
  uint32 line = 2;
  string condition = 3;
  string symbol_pattern = 4;
  string module_name = 5;
  uint32 thread_id = 6;
  bool is_regex = 7;
  uint64 address = 8;
  bool ignore_source_hash = 9;
}

message RemoveBreakpointRequest {
  int32 breakpoint_id = 1;
}

message AddWatchpointRequest {
  int32 value_id = 1;
  bool resolve_location = 2;
  bool watch_read = 3;
  bool watch_write = 4;
  string condition = 5;
}

message RemoveWatchpointRequest {
  int32 watchpoint_id = 1;
}

// ============================================================================
// Memory and Disassembly
// ============================================================================

message DisassembleRequest {
  uint64 start_address = 1;
  uint64 end_address = 2;
}

message DisassembleUntilPivotRequest {
  uint64 start_address = 1;
  uint64 pivot_address = 2;
  uint32 pivot_instruction_size = 3;
}

message DumpSectionsRequest {}

message DumpMemoryRequest {
  uint64 start_address = 1;
  uint64 end_address = 2;
}

message WriteMemoryRequest {
  uint64 address = 1;
  bytes data = 2;
}

message GetContextInfoRequest {
  uint64 address = 1;
  uint64 range_start = 2;
  uint64 range_end = 3;
}

// ============================================================================
// Expression Evaluation and Variables
// ============================================================================

message EvaluateExpressionRequest {
  string expression = 1;
  uint32 thread_id = 2;
  uint32 frame_index = 3;
}

message GetVariablesRequest {
  uint32 thread_id = 1;
  uint32 frame_index = 2;
  bool include_statics = 3;
  bool include_globals = 4;
}

message GetValueChildrenRequest {
  int32 value_id = 1;
  string expression = 2;
  uint32 offset = 3;
  uint32 count = 4;
}

message GetArraySliceRequest {
  int32 value_id = 1;
  uint32 offset = 2;
  uint32 count = 3;
}

message GetValueDataRequest {
  int32 value_id = 1;
  uint32 max_description_length = 2;
}

message GetValueDescriptionRequest {
  int32 value_id = 1;
  uint32 max_length = 2;
}

message GetChildrenCountRequest {
  int32 value_id = 1;
  string expression = 2;
}

message GetValueAddressRequest {
  int32 value_id = 1;
}

message SetValueFilteringPolicyRequest {
  bool filter_enabled = 1;
}

// ============================================================================
// Registers
// ============================================================================

message GetRegistersRequest {
  uint32 thread_id = 1;
  uint32 frame_index = 2;
  repeated string register_names = 3;
}

message GetRegisterSetsRequest {}

message GetArchitectureRequest {}

// ============================================================================
// Console and Commands
// ============================================================================

message DispatchInputRequest {
  string input = 1;
  DispatchTarget target = 2;
}

message HandleConsoleCommandRequest {
  uint32 thread_id = 1;
  uint32 frame_index = 2;
  string command = 3;
}

message HandleCompletionRequest {
  string command = 1;
  uint32 cursor_position = 2;
}

message ResizeConsoleRequest {
  uint32 columns = 1;
  uint32 rows = 2;
}

// ============================================================================
// Platform and Remote Debugging
// ============================================================================

message ConnectPlatformRequest {
  string platform = 1;
  string url = 2;
}

message ConnectProcessRequest {
  string url = 1;
  string plugin = 2;
  bool continue_after_connect = 3;
}

// ============================================================================
// Thread Control
// ============================================================================

message FreezeThreadRequest {
  uint32 thread_id = 1;
}

message UnfreezeThreadRequest {
  uint32 thread_id = 1;
}

// ============================================================================
// Signal Handling
// ============================================================================

message HandleSignalRequest {
  string signal_name = 1;
  bool should_stop = 2;
  bool should_pass = 3;
  bool should_notify = 4;
}

// ============================================================================
// Shell Commands
// ============================================================================

message ExecuteShellCommandRequest {
  string command = 1;
  string working_directory = 2;
  uint32 timeout_seconds = 3;
}

// ============================================================================
// Symbol Download
// ============================================================================

message CancelSymbolsDownloadRequest {
  string details = 1;
}
// ============================================================================
// Composite Request (for batching multiple requests)
// ============================================================================

message CompositeRequest {
  optional CreateTargetRequest create_target = 1;
  optional LaunchRequest launch = 2;
  optional ExitRequest exit = 3;
  optional ContinueRequest continue = 4;
  optional SuspendRequest suspend = 5;
  optional GetThreadsRequest get_threads = 6;
  optional GetFramesRequest get_frames = 7;
  optional AddBreakpointRequest add_breakpoint = 8;
  optional RemoveBreakpointRequest remove_breakpoint = 9;
  optional StepIntoRequest step_into = 10;
  optional StepOverRequest step_over = 11;
  optional StepOutRequest step_out = 12;
  optional EvaluateExpressionRequest evaluate_expression = 13;
  optional GetValueChildrenRequest get_value_children = 14;
  optional GetVariablesRequest get_variables = 15;
  optional HandleConsoleCommandRequest handle_console_command = 16;
  optional HandleCompletionRequest handle_completion = 17;
  optional AttachRequest attach = 18;
  optional AttachByNameRequest attach_by_name = 19;
  optional DispatchInputRequest dispatch_input = 20;
  optional AddWatchpointRequest add_watchpoint = 21;
  optional RemoveWatchpointRequest remove_watchpoint = 22;
  optional DetachRequest detach = 23;
  optional KillRequest kill = 24;
  optional GetChildrenCountRequest get_children_count = 25;
  optional GetArraySliceRequest get_array_slice = 26;
  optional GetValueDataRequest get_value_data = 27;
  optional GetValueDescriptionRequest get_value_description = 28;
  optional SetValueFilteringPolicyRequest set_value_filtering_policy = 29;
  optional ConnectPlatformRequest connect_platform = 30;
  optional GetValueAddressRequest get_value_address = 31;
  optional HandleSignalRequest handle_signal = 32;
  optional ExecuteShellCommandRequest execute_shell_command = 33;
  optional DisassembleRequest disassemble = 34;
  optional DumpSectionsRequest dump_sections = 35;
  optional DumpMemoryRequest dump_memory = 36;
  optional GetContextInfoRequest get_context_info = 37;
  optional StepScriptedRequest step_scripted = 38;
  optional ConnectProcessRequest connect_process = 39;
  optional RemoteLaunchRequest remote_launch = 40;
  optional JumpToLineRequest jump_to_line = 41;
  optional LoadCoreRequest load_core = 42;
  optional JumpToAddressRequest jump_to_address = 43;
  optional CancelSymbolsDownloadRequest cancel_symbols_download = 44;
  optional DisassembleUntilPivotRequest disassemble_until_pivot = 45;
  optional FreezeThreadRequest freeze_thread = 46;
  optional UnfreezeThreadRequest unfreeze_thread = 47;
  optional WriteMemoryRequest write_memory = 48;
  optional GetRegistersRequest get_registers = 49;
  optional GetArchitectureRequest get_architecture = 50;
  optional GetRegisterSetsRequest get_register_sets = 51;
  optional ResizeConsoleRequest resize_console = 52;
}
