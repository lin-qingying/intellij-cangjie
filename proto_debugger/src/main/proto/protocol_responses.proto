syntax = "proto3";

import "model.proto";
import "broadcasts.proto";

package proto;

// ============================================================================
// Base Response
// ============================================================================

message ResponseStatus {
  bool success = 1;
  string error_message = 2;
}

// ============================================================================
// Target and Process Management Responses
// ============================================================================

message CreateTargetResponse {
  ResponseStatus status = 1;
}

message LaunchResponse {
  ResponseStatus status = 1;
  int64 process_id = 2;
}

message AttachByNameResponse {
  ResponseStatus status = 1;
}

message AttachResponse {
  ResponseStatus status = 1;
}

message LoadCoreResponse {
  ResponseStatus status = 1;
}

message DetachResponse {
  ResponseStatus status = 1;
}

message KillResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Execution Control Responses
// ============================================================================

message ContinueResponse {
  ResponseStatus status = 1;
}

message SuspendResponse {
  ResponseStatus status = 1;
}

message StepIntoResponse {
  ResponseStatus status = 1;
}

message StepOverResponse {
  ResponseStatus status = 1;
}

message StepOutResponse {
  ResponseStatus status = 1;
}

message StepScriptedResponse {
  ResponseStatus status = 1;
}

message JumpToLineResponse {
  ResponseStatus status = 1;
  StackFrame current_frame = 2;
}

message JumpToAddressResponse {
  ResponseStatus status = 1;
  StackFrame current_frame = 2;
}

// ============================================================================
// Thread and Frame Inspection Responses
// ============================================================================

message GetThreadsResponse {
  ResponseStatus status = 1;
  repeated Thread threads = 2;
}

message GetFramesResponse {
  ResponseStatus status = 1;
  repeated StackFrame frames = 2;
  bool has_more = 3;
}

// ============================================================================
// Breakpoints and Watchpoints Responses
// ============================================================================

message AddBreakpointResponse {
  ResponseStatus status = 1;
  Breakpoint breakpoint = 2;
  repeated BreakpointLocation locations = 3;
}

message RemoveBreakpointResponse {
  ResponseStatus status = 1;
}

message AddWatchpointResponse {
  ResponseStatus status = 1;
  int32 watchpoint_id = 2;
}

message RemoveWatchpointResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Memory and Disassembly Responses
// ============================================================================

message DisassembleResponse {
  ResponseStatus status = 1;
  repeated Instruction instructions = 2;
}

message DumpSectionsResponse {
  ResponseStatus status = 1;
  repeated Module modules = 2;
}

message DumpMemoryResponse {
  ResponseStatus status = 1;
  bytes data = 2;
}

message WriteMemoryResponse {
  ResponseStatus status = 1;
}

message GetContextInfoResponse {
  ResponseStatus status = 1;
  ContextRegion context_info = 2;
}

// ============================================================================
// Expression Evaluation and Variables Responses
// ============================================================================

message EvaluateExpressionResponse {
  ResponseStatus status = 1;
  Value result = 2;
}

message GetVariablesResponse {
  ResponseStatus status = 1;
  repeated Value variables = 2;
}

message GetValueChildrenResponse {
  ResponseStatus status = 1;
  repeated Value children = 2;
}

message GetArraySliceResponse {
  ResponseStatus status = 1;
  repeated Value elements = 2;
}

message GetValueDataResponse {
  ResponseStatus status = 1;
  ValueData data = 2;
}

message GetValueDescriptionResponse {
  ResponseStatus status = 1;
  string description = 2;
}

message GetChildrenCountResponse {
  ResponseStatus status = 1;
  uint32 count = 2;
}

message GetValueAddressResponse {
  ResponseStatus status = 1;
  uint64 address = 2;
}

message SetValueFilteringPolicyResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Registers Responses
// ============================================================================

message GetRegistersResponse {
  ResponseStatus status = 1;
  repeated Register registers = 2;
}

message GetRegisterSetsResponse {
  ResponseStatus status = 1;
  repeated RegisterSet register_sets = 2;
}

message GetArchitectureResponse {
  ResponseStatus status = 1;
  string architecture = 2;
}

// ============================================================================
// Console and Commands Responses
// ============================================================================

message DispatchInputResponse {
  ResponseStatus status = 1;
}

message HandleConsoleCommandResponse {
  ResponseStatus status = 1;
  int32 return_code = 2;
  string error_output = 3;
  string standard_output = 4;
}

message HandleCompletionResponse {
  ResponseStatus status = 1;
  repeated string completions = 2;
}

message ResizeConsoleResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Platform and Remote Debugging Responses
// ============================================================================

message ConnectPlatformResponse {
  ResponseStatus status = 1;
}

message ConnectProcessResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Thread Control Responses
// ============================================================================

message FreezeThreadResponse {
  ResponseStatus status = 1;
}

message UnfreezeThreadResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Signal Handling Responses
// ============================================================================

message HandleSignalResponse {
  ResponseStatus status = 1;
}

// ============================================================================
// Shell Commands Responses
// ============================================================================

message ExecuteShellCommandResponse {
  ResponseStatus status = 1;
  string output = 2;
  int32 exit_status = 3;
  int32 signal_number = 4;
}

// ============================================================================
// Symbol Download Responses
// ============================================================================

message CancelSymbolsDownloadResponse {
  ResponseStatus status = 1;
}
// ============================================================================
// Composite Response (for batching multiple responses)
// ============================================================================

message CompositeResponse {
  optional CreateTargetResponse create_target = 1;
  optional LaunchResponse launch = 2;
  optional ContinueResponse continue = 3;
  optional CompositeBroadcast broadcasts = 4;
  optional SuspendResponse suspend = 5;
  optional GetThreadsResponse get_threads = 6;
  optional GetFramesResponse get_frames = 7;
  optional AddBreakpointResponse add_breakpoint = 8;
  optional RemoveBreakpointResponse remove_breakpoint = 9;
  optional StepIntoResponse step_into = 10;
  optional StepOverResponse step_over = 11;
  optional StepOutResponse step_out = 12;
  optional EvaluateExpressionResponse evaluate_expression = 13;
  optional GetValueChildrenResponse get_value_children = 14;
  optional GetVariablesResponse get_variables = 15;
  optional HandleConsoleCommandResponse handle_console_command = 16;
  optional HandleCompletionResponse handle_completion = 17;
  optional AttachResponse attach = 18;
  optional AttachByNameResponse attach_by_name = 19;
  optional DispatchInputResponse dispatch_input = 20;
  optional AddWatchpointResponse add_watchpoint = 21;
  optional RemoveWatchpointResponse remove_watchpoint = 22;
  optional DetachResponse detach = 23;
  optional KillResponse kill = 24;
  optional GetChildrenCountResponse get_children_count = 25;
  optional GetArraySliceResponse get_array_slice = 26;
  optional GetValueDataResponse get_value_data = 27;
  optional GetValueDescriptionResponse get_value_description = 28;
  optional SetValueFilteringPolicyResponse set_value_filtering_policy = 29;
  optional ConnectPlatformResponse connect_platform = 30;
  optional GetValueAddressResponse get_value_address = 31;
  optional HandleSignalResponse handle_signal = 32;
  optional ExecuteShellCommandResponse execute_shell_command = 33;
  optional DisassembleResponse disassemble = 34;
  optional DumpSectionsResponse dump_sections = 35;
  optional DumpMemoryResponse dump_memory = 36;
  optional GetContextInfoResponse get_context_info = 37;
  optional StepScriptedResponse step_scripted = 38;
  optional ConnectProcessResponse connect_process = 39;
  optional JumpToLineResponse jump_to_line = 40;
  optional LoadCoreResponse load_core = 41;
  optional JumpToAddressResponse jump_to_address = 42;
  optional CancelSymbolsDownloadResponse cancel_symbols_download = 43;
  optional FreezeThreadResponse freeze_thread = 44;
  optional UnfreezeThreadResponse unfreeze_thread = 45;
  optional WriteMemoryResponse write_memory = 46;
  optional GetRegistersResponse get_registers = 47;
  optional GetArchitectureResponse get_architecture = 48;
  optional GetRegisterSetsResponse get_register_sets = 49;
  optional ResizeConsoleResponse resize_console = 50;
}