# IDE 诊断消息 Bundle（中文）- HTML 格式，用于 IDE 显示
# 此文件包含针对 IDE 工具提示和快速修复优化的 HTML 格式诊断消息
# 纯文本消息请参见 CangJieDiagnosisBundle_zh_CN.properties

# 常见错误消息（HTML 格式）
NO_RETURN_IN_FUNCTION_WITH_BLOCK_BODY=需要 <b>return</b> 表达式（函数体为代码块 <code>{...}</code> 时）
TYPE_MISMATCH=类型不匹配:<br/><table><tr><td>预期:</td><td><b>{0}</b></td></tr><tr><td>实际:</td><td><b>{1}</b></td></tr></table>
UNRESOLVED_REFERENCE=未解析的引用: <b>{0}</b>
CONFLICTING_OVERLOADS=重载冲突: <code>{0}</code>
REDECLARATION=冲突声明: <b>{0}</b>
FUNCTION_CALL_EXPECTED=预期函数调用 <code>{0}({1})</code>
NO_VALUE_FOR_PARAMETER=未为参数 <b>{0}</b> 传递值
OVERLOAD_RESOLUTION_AMBIGUITY=重载决议模糊性:<br/><code>{0}</code>
INVALID_BINARY_OPERATOR=类型 <b>{1}</b> 和 <b>{2}</b> 上的无效二进制操作符 <code>{0}</code><br/>您可能想要为类型 <b>{5}</b> 实现 <code>operator func {3}(right: {4})</code>
CONSTANT_EXPECTED_TYPE_MISMATCH=<b>{0}</b> 字面量不符合预期类型 <b>{1}</b>
INVISIBLE_REFERENCE=无法访问 <b>{0}</b>: 它在 <code>{2}</code> 中是 <i>{1}</i>
ABSTRACT_MEMBER_NOT_IMPLEMENTED=<b>{0}</b> 不是抽象的且未实现抽象成员 <code>{1}</code>
NOTHING_TO_OVERRIDE=<code>{0}</code> 没有可覆盖的成员
RETURN_TYPE_MISMATCH_ON_OVERRIDE=<code>{0}</code> 的返回类型不是被覆盖成员 <code>{1}</code> 的返回类型的子类型
UPPER_BOUND_VIOLATED=类型参数不在其界限内: 应为 <b>{0}</b> 的子类型
CYCLIC_INHERITANCE_HIERARCHY=此类型的继承层次结构中存在循环
FINAL_SUPERTYPE=超类 <b>{0}</b> 不可继承
MUST_BE_INITIALIZED=变量必须初始化
VARIABLE_EXPECTED=预期为变量

UNREACHABLE_CODE=不可达代码
NAMED_PARAMETER_NOT_FOUND=找不到此名称的参数: <b>{0}</b>
NO_ELSE_IN_MATCH_BY_PATTERN=<code>match</code> 表达式必须是穷尽的,请添加必要的 <b>{0}</b>
CYCLIC_IMPORT=检测到循环导入: <code>{0}</code>
EXCEPTION_FROM_ANALYZER=分析此表达式时发生内部错误:<br/><code>{0}</code>
ABSTRACT_FUNCTION_WITHOUT_RETURN_TYPE=抽象方法必须显式指定返回值类型
TUPLE_PATTERN_TYPE_MISMATCH=类型不匹配：推断类型为Tuple，但应为{0}

# 额外的类型相关错误消息
INCOMPATIBLE_TYPES=不兼容的类型:<br/><table><tr><td>类型 1:</td><td><b>{0}</b></td></tr><tr><td>类型 2:</td><td><b>{1}</b></td></tr></table>
RECEIVER_TYPE_MISMATCH=接收者类型不匹配:<br/><table><tr><td>预期:</td><td><b>{0}</b></td></tr><tr><td>实际:</td><td><b>{1}</b></td></tr></table>
TYPE_MISMATCH_IN_FOR_LOOP=for-in 循环中类型不匹配:<br/><table><tr><td>预期:</td><td><b>{0}</b></td></tr><tr><td>实际:</td><td><b>{1}</b></td></tr></table>
TYPE_MISMATCH_MULTIPLE_SUPERTYPES=无法确定以下类型的公共超类型: <b>{0}</b>

# 继承相关错误消息
CONFLICTING_INHERITED_MEMBERS=类 <code>{0}</code> 继承了冲突的成员:<br/>{1}
OVERRIDING_FINAL_MEMBER=<code>{1}</code> 中的 <code>{0}</code> 是 <b>final</b> 的，无法覆盖
RETURN_TYPE_MISMATCH_ON_INHERITANCE=继承时返回类型不匹配:<br/><code>{0}</code> 和 <code>{1}</code> 的返回类型不兼容

# 访问权限相关错误消息
CANNOT_CHANGE_ACCESS_PRIVILEGE=无法更改 <code>{2}</code> 中 <code>{1}</code> 的访问权限 <b>{0}</b>
CANNOT_WEAKEN_ACCESS_PRIVILEGE=无法削弱 <code>{2}</code> 中 <code>{1}</code> 的访问权限 <b>{0}</b>

# 属性覆盖错误消息
LET_OVERRIDDEN_BY_VAR=<code>var</code> 属性 <code>{0}</code> 无法覆盖 <code>let</code> 属性 <code>{1}</code>
VAR_OVERRIDDEN_BY_LET=<code>let</code> 属性 <code>{0}</code> 无法覆盖 <code>var</code> 属性 <code>{1}</code>
PROPERTY_TYPE_MISMATCH_ON_OVERRIDE=属性类型不匹配:<br/><code>{0}</code> 与被覆盖成员 <code>{1}</code> 的类型不同
PROPERTY_TYPE_MISMATCH_ON_INHERITANCE=继承时属性类型冲突:<br/><code>{0}</code> 和 <code>{1}</code> 的类型不兼容

# 可见性错误消息
INVISIBLE_MEMBER=无法访问 <code>{0}</code>: 它在 <code>{2}</code> 中是 <i>{1}</i>
INVISIBLE_SETTER=<code>{0}</code> 的 setter 在 <code>{2}</code> 中是 <i>{1}</i>

# 可调用引用错误消息
CALLABLE_REFERENCE_RESOLUTION_AMBIGUITY=可调用引用解析歧义:<br/>{0}
NONE_APPLICABLE=以下候选项均不适用:<br/>{0}
CANNOT_COMPLETE_RESOLVE=无法完成解析，所有适用的候选项:<br/>{0}

# 参数相关错误消息
TOO_MANY_ARGUMENTS=<code>{0}</code> 的参数过多
UNSAFE_CALL=在可选类型 <b>{0}</b> 的接收者上只允许安全调用 (<code>?.</code>)

# 构造器错误消息
NO_CONSTRUCTOR=未找到 <code>{0}</code> 的构造函数
CYCLIC_CONSTRUCTOR_DELEGATION_CALL=检测到循环的构造函数委托调用

# 超类型错误消息
SUPERTYPE_NOT_INITIALIZED=超类型 <b>{0}</b> 必须初始化
SUPERTYPE_NOT_A_CLASS_OR_INTERFACE=超类型不是类或接口: <code>{0}</code>
SUPERTYPE_APPEARS_TWICE=同一类型在超类型列表中出现两次: <b>{0}</b>

# Match 表达式错误消息
MATCH_EXPRESSION_MUST_BE_EXHAUSTIVE=<code>match</code> 表达式必须是穷尽的:<br/>缺失的情况: <b>{0}</b>