# IDE Diagnosis Bundle - HTML formatted messages for IDE display
# This file contains HTML-formatted diagnostic messages optimized for IDE tooltips and quick fixes
# For plain text messages, see CangJieDiagnosisBundle.properties

# Common error messages with HTML formatting
NO_RETURN_IN_FUNCTION_WITH_BLOCK_BODY=A <b>return</b> expression required in a function with a block body (<code>{...}</code>)
TYPE_MISMATCH=Type mismatch:<br/><table><tr><td>Expected:</td><td><b>{0}</b></td></tr><tr><td>Found:</td><td><b>{1}</b></td></tr></table>
UNRESOLVED_REFERENCE=Reference not found: <b>{0}</b>
CONFLICTING_OVERLOADS=Conflicting overloads: <code>{0}</code>
REDECLARATION=Conflicting declarations: <b>{0}</b>
FUNCTION_CALL_EXPECTED=Function invocation <code>{0}({1})</code> expected
NO_VALUE_FOR_PARAMETER=No value passed for parameter <b>{0}</b>
OVERLOAD_RESOLUTION_AMBIGUITY=Overload resolution ambiguity:<br/><code>{0}</code>
INVALID_BINARY_OPERATOR=Invalid binary operator <code>{0}</code> on type <b>{1}</b> and <b>{2}</b><br/>You may want to implement <code>operator func {3}(right: {4})</code> for type <b>{5}</b>
CONSTANT_EXPECTED_TYPE_MISMATCH=The <b>{0}</b> literal does not conform to the expected type <b>{1}</b>
INVISIBLE_REFERENCE=Cannot access <b>{0}</b>: it is <i>{1}</i> in <code>{2}</code>
ABSTRACT_MEMBER_NOT_IMPLEMENTED=<b>{0}</b> is not abstract and does not implement abstract member <code>{1}</code>
NOTHING_TO_OVERRIDE=<code>{0}</code> overrides nothing
RETURN_TYPE_MISMATCH_ON_OVERRIDE=Return type of <code>{0}</code> is not a subtype of the return type of the overridden member <code>{1}</code>
UPPER_BOUND_VIOLATED=Type argument is not within its bounds: should be subtype of <b>{0}</b>
CYCLIC_INHERITANCE_HIERARCHY=There's a cycle in the inheritance hierarchy for this type
FINAL_SUPERTYPE=Super class <b>{0}</b> is not inheritable
MUST_BE_INITIALIZED=Variable must be initialized
VARIABLE_EXPECTED=Variable expected

UNREACHABLE_CODE=Unreachable code
IRREFUTABLE_PATTERN_ERROR=Refutable pattern in <code>let</code> declaration is not allowed
NAMED_PARAMETER_NOT_FOUND=Cannot find a parameter with this name: <b>{0}</b>
NO_ELSE_IN_MATCH_BY_PATTERN=<code>match</code> expression must be exhaustive, add necessary <b>{0}</b>
CYCLIC_IMPORT=Cyclic import detected: <code>{0}</code>
EXCEPTION_FROM_ANALYZER=Internal Error occurred while analyzing this expression:<br/><code>{0}</code>
ABSTRACT_FUNCTION_WITHOUT_RETURN_TYPE=Abstract function must have return type
TUPLE_PATTERN_TYPE_MISMATCH=Type mismatch: inferred type is Tuple but {0} was expected

# Additional type-related error messages
INCOMPATIBLE_TYPES=Incompatible types:<br/><table><tr><td>Type 1:</td><td><b>{0}</b></td></tr><tr><td>Type 2:</td><td><b>{1}</b></td></tr></table>
RECEIVER_TYPE_MISMATCH=Receiver type mismatch:<br/><table><tr><td>Expected:</td><td><b>{0}</b></td></tr><tr><td>Found:</td><td><b>{1}</b></td></tr></table>
TYPE_MISMATCH_IN_FOR_LOOP=Type mismatch in for-in loop:<br/><table><tr><td>Expected:</td><td><b>{0}</b></td></tr><tr><td>Found:</td><td><b>{1}</b></td></tr></table>
TYPE_MISMATCH_MULTIPLE_SUPERTYPES=Cannot determine common supertype for the following types: <b>{0}</b>

# Inheritance-related error messages
CONFLICTING_INHERITED_MEMBERS=Class <code>{0}</code> inherits conflicting members:<br/>{1}
OVERRIDING_FINAL_MEMBER=<code>{0}</code> in <code>{1}</code> is <b>final</b> and cannot be overridden
RETURN_TYPE_MISMATCH_ON_INHERITANCE=Return type mismatch on inheritance:<br/><code>{0}</code> and <code>{1}</code> have incompatible return types

# Access-related error messages
CANNOT_CHANGE_ACCESS_PRIVILEGE=Cannot change access privilege <b>{0}</b> for <code>{1}</code> in <code>{2}</code>
CANNOT_WEAKEN_ACCESS_PRIVILEGE=Cannot weaken access privilege <b>{0}</b> for <code>{1}</code> in <code>{2}</code>

# Property override error messages
LET_OVERRIDDEN_BY_VAR=<code>var</code> property <code>{0}</code> cannot override <code>let</code> property <code>{1}</code>
VAR_OVERRIDDEN_BY_LET=<code>let</code> property <code>{0}</code> cannot override <code>var</code> property <code>{1}</code>
PROPERTY_TYPE_MISMATCH_ON_OVERRIDE=Property type mismatch:<br/><code>{0}</code> has different type than overridden member <code>{1}</code>
PROPERTY_TYPE_MISMATCH_ON_INHERITANCE=Property type conflict on inheritance:<br/><code>{0}</code> and <code>{1}</code> have incompatible types

# Visibility error messages
INVISIBLE_MEMBER=Cannot access <code>{0}</code>: it is <i>{1}</i> in <code>{2}</code>
INVISIBLE_SETTER=Setter for <code>{0}</code> is <i>{1}</i> in <code>{2}</code>

# Callable reference error messages
CALLABLE_REFERENCE_RESOLUTION_AMBIGUITY=Callable reference resolution ambiguity:<br/>{0}
NONE_APPLICABLE=None of the following candidates is applicable:<br/>{0}
CANNOT_COMPLETE_RESOLVE=Cannot complete resolve. All applicable candidates:<br/>{0}

# Argument-related error messages
TOO_MANY_ARGUMENTS=Too many arguments for <code>{0}</code>
UNSAFE_CALL=Only safe (<code>?.</code>) calls are allowed on a option receiver of type <b>{0}</b>

# Constructor error messages
NO_CONSTRUCTOR=No constructor found for <code>{0}</code>
CYCLIC_CONSTRUCTOR_DELEGATION_CALL=Cyclic constructor delegation call detected

# Supertype error messages
SUPERTYPE_NOT_INITIALIZED=Supertype <b>{0}</b> must be initialized
SUPERTYPE_NOT_A_CLASS_OR_INTERFACE=Supertype is not a class or interface: <code>{0}</code>
SUPERTYPE_APPEARS_TWICE=Same type appears twice in supertype list: <b>{0}</b>

# Match expression error messages
MATCH_EXPRESSION_MUST_BE_EXHAUSTIVE=<code>match</code> expression must be exhaustive:<br/>Missing cases: <b>{0}</b>