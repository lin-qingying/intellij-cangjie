ktor:
  deployment:
    port: 8880
  application:
    modules:
      - "cn.cangnova.ApplicationKt.module"

# JWT配置
jwt:
  secret: "cangjie-telemetry-secret-key-for-jwt-authentication-please-change-in-production"
  issuer: "cangjie-telemetry"
  audience: "cangjie-telemetry-users"
  realm: "CangJie Telemetry API"

database:
  # 数据库类型: mongodb, mysql, postgresql
  type: "mongodb"
  
  # MongoDB配置
  mongodb:
    #    connection_string: "mongodb://172.18.0.4:27017"
    connection_string: "mongodb://localhost:27017"

    database_name: "telemetry"
    # 认证配置
    auth:
      enabled: false
      username: "mongo_DJCwak"
      password: "mongo_zZFWXY"
    # 连接池配置
    pool:
      max_size: 20
      min_size: 5
      max_wait_time_ms: 5000
      max_connection_lifetime_ms: 30000
  
  # MySQL配置
  mysql:
    url: "jdbc:mysql://localhost:3306/telemetry"
    driver: "com.mysql.cj.jdbc.Driver"
    user: "root"
    password: "password"
    # 连接池配置
    pool:
      max_size: 10
      min_size: 3
      idle_timeout_ms: 30000
      max_lifetime_ms: 60000
  
  # PostgreSQL配置
  postgresql:
    url: "jdbc:postgresql://localhost:5432/telemetry"
    driver: "org.postgresql.Driver"
    user: "postgres"
    password: "password"
    # 连接池配置
    pool:
      max_size: 10
      min_size: 3
      idle_timeout_ms: 30000
      max_lifetime_ms: 60000

telemetry:
  # 遥测服务配置
  server:
    # 数据保留天数
    data_retention_days: 30
    # 批处理大小
    batch_size: 100 